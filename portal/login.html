<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aachico Vault - Login Portal</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Master Theme & Responsive CSS -->
  <link rel="stylesheet" href="../css/themes.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center py-12 px-4 selection:bg-amber-500 selection:text-slate-950">

  <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-slate-800 space-y-6 shadow-2xl bg-slate-900/90">
    
    <div class="text-center space-y-2">
      <a href="../index.html" class="inline-flex w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 items-center justify-center font-black text-2xl border border-amber-500/40 shadow-lg shadow-amber-500/10 mb-2">
        V
      </a>
      <h1 class="text-xl font-black text-white tracking-tight">फ्लीट एडमिन व मैनेजर लॉगिन</h1>
      <p class="text-xs text-slate-400">अपने Aachico Vault अकाउंट में प्रवेश करें।</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 mb-1 font-medium">ईमेल आईडी</label>
        <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500 transition" placeholder="name@company.com">
      </div>

      <div>
        <label class="block text-slate-400 mb-1 font-medium">पासवर्ड / पिन</label>
        <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-3 text-white font-mono focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
      </div>

      <button type="submit" id="login-btn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm flex items-center justify-center space-x-2">
        <span id="btn-text">सिक्योर लॉगिन करें</span>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800 space-y-2 text-xs">
      <p class="text-slate-400">नया अकाउंट बनाना चाहते हैं?</p>
      <a href="signup.html" class="inline-block text-amber-400 hover:underline font-bold">
        फ्री रजिस्ट्रेशन करें
      </a>
    </div>

  </div>

  <footer class="mt-8 text-center text-xs text-slate-500">
    <p>सुरक्षित मल्टी-टेनेंट एन्क्रिप्टेड पोर्टल</p>
  </footer>

  <!-- Firebase & Auth Engine Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/config/firebase-init.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Loading state enable karein
      loginBtn.disabled = true;
      loginBtn.classList.add('opacity-70', 'cursor-not-allowed');
      btnText.textContent = "लॉगिन हो रहा है...";

      try {
        // Firebase Authentication Sign-in
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Firestore se user role aur company data fetch karna
        let role = 'driver';
        let companyId = 'default_company';

        if (window.db) {
          const userDoc = await window.db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            role = userDoc.data().role || 'driver';
            companyId = userDoc.data().companyId || 'default_company';
          }
        }

        // AachicoAuth engine ke zariye session set karna
        if (window.AachicoAuth && typeof window.AachicoAuth.loginUser === 'function') {
          window.AachicoAuth.loginUser({
            uid: user.uid,
            email: user.email,
            role: role,
            companyId: companyId
          });
        } else {
          // Fallback redirect agar AachicoAuth load na ho
          window.location.href = `../dashboards/${role}.html`;
        }

      } catch (error) {
        console.error("Login Error:", error);
        let errorMsg = error.message;
        
        // User-friendly Hindi error messages
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          errorMsg = "गलत ईमेल या पासवर्ड दर्ज किया गया है। कृपया पुनः प्रयास करें।";
        } else if (error.code === 'auth/invalid-email') {
          errorMsg = "अमान्य ईमेल format है।";
        } else if (error.code === 'auth/too-many-requests') {
          errorMsg = "बहुत ज्यादा असफल प्रयासों के कारण अकाउंट अस्थायी रूप से लॉक है। थोड़ी देर बाद कोशिश करें।";
        }

        alert("लॉगिन असफल: " + errorMsg);
        
        // Button reset karein
        loginBtn.disabled = false;
        loginBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        btnText.textContent = "सिक्योर लॉगिन करें";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
